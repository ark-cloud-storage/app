events{}
http {
    include /etc/nginx/mime.types;
    server_tokens off;
    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.arkcloudstorage.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
